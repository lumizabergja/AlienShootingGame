name: Build native Vulkan capture prototype
on:
  push:
    branches: [native-vulkan-capture]
    paths: ['VulkanCapturePrototype/**', '.github/workflows/build-vulkan-prototype.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch Vulkan headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.3.290 https://github.com/KhronosGroup/Vulkan-Headers.git vendor/Vulkan-Headers
          if ($LASTEXITCODE -ne 0) { throw 'Header download failed' }
      - name: Prepare Vulkan runtime import library definition
        shell: pwsh
        run: |
          $source = Get-Content VulkanCapturePrototype/main.cpp -Raw
          $symbols = [regex]::Matches($source, '\b(vk[A-Z]\w*)\s*\(') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          @('LIBRARY vulkan-1.dll', 'EXPORTS') + $symbols | Set-Content VulkanCapturePrototype/vulkan-1.def -Encoding ascii
      - name: Compile Windows x64 executable
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          lib /nologo /def:VulkanCapturePrototype\vulkan-1.def /machine:x64 /out:VulkanCapturePrototype\vulkan-1.lib
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /EHsc /O2 /MT /W4 VulkanCapturePrototype\main.cpp /Ivendor\Vulkan-Headers\include /Fe:VulkanCapturePrototype\VulkanCapturePrototype.exe /link VulkanCapturePrototype\vulkan-1.lib d3d11.lib dxgi.lib user32.lib
          if errorlevel 1 exit /b 1
          dumpbin /headers VulkanCapturePrototype\VulkanCapturePrototype.exe
          dumpbin /dependents VulkanCapturePrototype\VulkanCapturePrototype.exe
      - uses: actions/upload-artifact@v4
        with:
          name: VulkanCapturePrototype-Windows-x64
          path: |
            VulkanCapturePrototype/VulkanCapturePrototype.exe
            VulkanCapturePrototype/README.md
          if-no-files-found: error
