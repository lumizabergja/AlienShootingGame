name: Build Magpie Vulkan Portable

on:
  push:
    branches:
      - magpie-vulkan-package
    paths:
      - '.github/workflows/magpie-vulkan-package.yml'
      - 'magpie-vulkan/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout patch files
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --upgrade pip
          pip install conan
          choco install vulkan-sdk -y --no-progress

          $sdk = Get-ChildItem 'C:\VulkanSDK' -Directory | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $sdk) { throw 'Vulkan SDK was not installed' }
          "VULKAN_SDK=$($sdk.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "INCLUDE=$($sdk.FullName)\Include;$env:INCLUDE" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$($sdk.FullName)\Lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Clone Magpie 0.12.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch v0.12.1 https://github.com/Blinue/Magpie.git MagpieVulkan

      - name: Apply Vulkan presenter
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item 'magpie-vulkan\AdaptivePresenter.h' 'MagpieVulkan\src\Magpie.Core\AdaptivePresenter.h' -Force
          Copy-Item 'magpie-vulkan\AdaptivePresenter.cpp' 'MagpieVulkan\src\Magpie.Core\AdaptivePresenter.cpp' -Force

          $cpp = 'MagpieVulkan\src\Magpie.Core\AdaptivePresenter.cpp'
          $text = Get-Content $cpp -Raw
          $text = $text.Replace('#include <vector>', "#include <vector>`r`n#pragma comment(lib, `"vulkan-1.lib`")")
          Set-Content -Path $cpp -Value $text -Encoding utf8

      - name: Build x64 release
        shell: pwsh
        working-directory: MagpieVulkan
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/publish.py --compiler=MSVC --platform=x64

      - name: Add Vulkan build note
        shell: pwsh
        run: |
          $note = @(
            'Magpie Vulkan Presenter - experimental build',
            '',
            'This is Magpie 0.12.1 with its final presentation stage replaced by a native Vulkan swapchain.',
            'League of Legends is not injected or modified.',
            '',
            'Pipeline:',
            'League DX11 -> Magpie capture/effects -> D3D11 final texture -> Vulkan upload/present -> NVIDIA Smooth Motion',
            '',
            'Run Magpie.exe normally, scale League, then enable Smooth Motion for Magpie.exe in NVIDIA App.',
            '',
            'This first build uses a CPU readback/upload bridge so we can validate Vulkan presentation and Smooth Motion hooking before moving to zero-copy D3D11/Vulkan interop.'
          )
          $note | Set-Content -Path 'MagpieVulkan\publish\x64\README-VULKAN.txt' -Encoding utf8

      - name: Upload portable app
        uses: actions/upload-artifact@v4
        with:
          name: Magpie-Vulkan-Portable
          path: MagpieVulkan/publish/x64
          if-no-files-found: error
