name: External DLSS-G experimental Windows x64
on:
  push:
    branches: [external-dlssg-presetc-20261105]
    paths:
      - 'external-dlssg/src/**'
      - 'external-dlssg/CMakeLists.txt'
      - 'external-dlssg/README.md'
      - '.github/workflows/external-dlssg-live-win-x64.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Get official NVIDIA DLSS SDK
        shell: pwsh
        run: git clone --depth 1 https://github.com/NVIDIA/DLSS.git "$env:RUNNER_TEMP/DLSS"
      - name: Configure and compile Windows app with MSVC
        shell: pwsh
        run: |
          cmake -S external-dlssg -B "$env:RUNNER_TEMP/dlssg-build" -G "Visual Studio 17 2022" -A x64 -D "DLSS_SDK_DIR=$env:RUNNER_TEMP/DLSS"
          cmake --build "$env:RUNNER_TEMP/dlssg-build" --config Release --parallel
      - name: Validate HLSL shader on Windows runner
        shell: pwsh
        run: |
          $shaderTest = Start-Process -FilePath "$env:RUNNER_TEMP/dlssg-build/Release/ExternalDLSSG.exe" -ArgumentList "--shader-test" -Wait -PassThru
          if ($shaderTest.ExitCode -ne 0) { throw "D3DCompile failed (exit $($shaderTest.ExitCode))" }
      - name: Test D3D11 and D3D12 shared texture using Windows WARP
        shell: pwsh
        run: |
          $interop = Start-Process -FilePath "$env:RUNNER_TEMP/dlssg-build/Release/ExternalDLSSG.exe" -ArgumentList "--interop-test" -Wait -PassThru
          if ($interop.ExitCode -ne 0) { throw "Cross-API shared resource validation failed (exit $($interop.ExitCode))" }
      - name: Package executable and NVIDIA runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "$env:RUNNER_TEMP/dlssg-build/Release/ExternalDLSSG.exe" dist/
          Copy-Item "$env:RUNNER_TEMP/DLSS/lib/Windows_x86_64/rel/nvngx_dlssg.dll" dist/
          Copy-Item external-dlssg/README.md dist/
          Copy-Item external-dlssg/LICENSE-NOTICE.txt dist/
          Get-FileHash dist/ExternalDLSSG.exe -Algorithm SHA256 | Format-List | Out-File dist/checksum.txt
          Compress-Archive -Path dist/* -DestinationPath ExternalDLSSG-Experimental-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ExternalDLSSG-Experimental-Windows-x64
          path: ExternalDLSSG-Experimental-Windows-x64.zip
          if-no-files-found: error
      - name: Publish ZIP on isolated GitHub branch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          New-Item -ItemType Directory -Force external-dlssg/releases | Out-Null
          Copy-Item ExternalDLSSG-Experimental-Windows-x64.zip external-dlssg/releases/
          git add external-dlssg/releases/ExternalDLSSG-Experimental-Windows-x64.zip
          git commit -m "Publish experimental Windows ZIP [skip ci]"
          git push origin HEAD:external-dlssg-presetc-20261105
