name: Build V26 Late Wait
on:
  push:
    branches: [dlss-v26-late-wait-20261006]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get SDK headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git Streamline
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git clone --depth 1 https://github.com/mbucchia/Optical-Flow-SDK.git OpticalFlow
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Compile Windows x64
        shell: cmd
        run: |
          cd source
          rc /nologo /fo app.res app.rc
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++20 /O2 /MT /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /I "..\Streamline\include" /I "..\OpticalFlow\NvOFInterface" main.cpp dlss_bridge.cpp nvof_bridge.cpp wgc_capture.cpp app.res /Fe:"..\DX12-DLSS-FG-V26-LATE-WAIT.exe" /link /SUBSYSTEM:WINDOWS d3d12.lib d3d11.lib dxgi.lib d3dcompiler.lib dwmapi.lib comctl32.lib shell32.lib ole32.lib user32.lib gdi32.lib wintrust.lib crypt32.lib windowsapp.lib
          if errorlevel 1 exit /b 1
      - name: Record build identity
        shell: pwsh
        run: |
          $hash = (Get-FileHash DX12-DLSS-FG-V26-LATE-WAIT.exe -Algorithm SHA256).Hash
          "Commit: $env:GITHUB_SHA`nExecutable SHA256: $hash`nWindows x64 MSVC /O2 /MT compilation: passed`nRTX runtime and latency testing: not performed" | Set-Content BUILD-VALIDATION.txt
          git -C Streamline rev-parse HEAD | Add-Content BUILD-VALIDATION.txt
          git -C OpticalFlow rev-parse HEAD | Add-Content BUILD-VALIDATION.txt
      - uses: actions/upload-artifact@v4
        with:
          name: DX12-DLSS-FG-V26-LATE-WAIT
          path: |
            DX12-DLSS-FG-V26-LATE-WAIT.exe
            BUILD-VALIDATION.txt
          if-no-files-found: error
