name: Build DLSS FG Ultra v4 NVOFA

on:
  push:
    branches: [dlss-fg-ultra-v4]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct finished v4 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\.v4payload\*.txt" | Sort-Object Name
          if (-not $parts) { throw "v4 payload missing" }
          $b64 = ""
          foreach ($p in $parts) { $b64 += Get-Content $p.FullName -Raw }
          $b64 = $b64 -replace "[^A-Za-z0-9+/=]", ""
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\v4-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:GITHUB_WORKSPACE\v4-source.zip" "$env:GITHUB_WORKSPACE\v4-source" -Force

      - name: Get Streamline 2.14.1 headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git "$env:GITHUB_WORKSPACE\Streamline"

      - name: Get NVIDIA Optical Flow headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mbucchia/Optical-Flow-SDK.git "$env:GITHUB_WORKSPACE\OpticalFlow"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 Release
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\v4-source\source"
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c++20 /O2 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /I "%GITHUB_WORKSPACE%\Streamline\include" /I "%GITHUB_WORKSPACE%\OpticalFlow\NvOFInterface" main.cpp dlss_bridge.cpp nvof_bridge.cpp app.res /Fe:"%GITHUB_WORKSPACE%\LoLDX12Presenter-FG.exe" /link d3d12.lib d3d11.lib dxgi.lib d3dcompiler.lib dwmapi.lib comctl32.lib shell32.lib ole32.lib user32.lib gdi32.lib wintrust.lib crypt32.lib /SUBSYSTEM:WINDOWS

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LoLDX12Presenter-FG-Ultra-v4-NVOFA
          path: LoLDX12Presenter-FG.exe
          if-no-files-found: error
