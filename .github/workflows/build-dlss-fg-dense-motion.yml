name: Build DLSS FG Ultra v4.1

on:
  push:
    branches: [dlss-fg-ultra-v4-1]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct finished v4 source
        shell: pwsh
        run: |
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\.v4payload\*.txt" | Sort-Object Name
          if (-not $parts) { throw "v4 payload missing" }
          $b64 = ""
          foreach ($p in $parts) { $b64 += Get-Content $p.FullName -Raw }
          $b64 = $b64 -replace "[^A-Za-z0-9+/=]", ""
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\v4-source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:GITHUB_WORKSPACE\v4-source.zip" "$env:GITHUB_WORKSPACE\v4-source" -Force

      - name: Apply v4.1 source edits
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\v4-source\source"

          $p = Join-Path $root "dlss_bridge.cpp"
          $s = Get-Content $p -Raw
          $s = $s.Replace('    zeroCopy=(sourceDesc.Width==w && sourceDesc.Height==h && sourceDesc.Format==DXGI_FORMAT_B8G8R8A8_UNORM);',
                          '    zeroCopy=false; // v4.1: decouple capture texture lifetime from DLSS-G')
          $a = $s.IndexOf('    // NVOFA direct-source path is used only when capture and output dimensions match.')
          $b = $s.IndexOf('    Texture(motion,rw,rh,DXGI_FORMAT_R16G16_FLOAT,read);', $a)
          if ($a -lt 0 -or $b -lt 0) { throw 'Could not locate v4 color/NVOFA resource block' }
          $rep = @(
            '    // v4.1: internal DLSS-G color texture + direct-source NVOFA.',
            '    // This prevents FG from holding the shared DXGI capture texture across frames.',
            '    Texture(current,rw,rh,DXGI_FORMAT_R8G8B8A8_UNORM,read);',
            '    result=current;',
            '    nvof.Init(dev,source,(UINT)sourceDesc.Width,sourceDesc.Height,log);',
            '    if(nvof.Available()) previous=nvof.Previous();',
            '    else Texture(previous,rw,rh,DXGI_FORMAT_R8G8B8A8_UNORM,read);',
            '    log(L"v4.1 decoupled color path: internal DLSS-G color + direct-source NVOFA; capture is not held by FG.");',
            ''
          ) -join [Environment]::NewLine
          $s = $s.Substring(0,$a) + $rep + $s.Substring($b)
          $s = $s.Replace('SRV(previous.Get(),zeroCopy?DXGI_FORMAT_B8G8R8A8_UNORM:DXGI_FORMAT_R8G8B8A8_UNORM,2);',
                          'SRV(previous.Get(),nvof.Available()?DXGI_FORMAT_B8G8R8A8_UNORM:DXGI_FORMAT_R8G8B8A8_UNORM,2);')
          $a = $s.IndexOf('void DlssExperiment::BeforeFrame(ID3D12CommandQueue* queue) {')
          $b = $s.IndexOf('void DlssExperiment::AfterPresent()', $a)
          if ($a -lt 0 -or $b -lt 0) { throw 'Could not locate BeforeFrame block' }
          $rep = @(
            'void DlssExperiment::BeforeFrame(ID3D12CommandQueue* queue) {',
            '    // v4.1: GPU-queue the previous FG input dependency instead of CPU-blocking capture.',
            '    if (inputFence && inputFenceValue && inputFence->GetCompletedValue() < inputFenceValue)',
            '        HR(queue->Wait(inputFence.Get(),inputFenceValue),"Queue previous FG input consumption wait");',
            '}',
            ''
          ) -join [Environment]::NewLine
          $s = $s.Substring(0,$a) + $rep + $s.Substring($b)
          Set-Content -Path $p -Value $s -NoNewline

          $p = Join-Path $root "nvof_bridge.cpp"
          $s = Get-Content $p -Raw
          $s = $s.Replace('    backward_=MakeTexture(DXGI_FORMAT_R16G16_SINT,flowW_,flowH_,L"NVOFA backward flow");',
                          '    backward_.Reset(); // v4.1: forward-only OF for lower latency')
          $s = $s.Replace('    init.predDirection=backward_?NV_OF_PRED_DIRECTION_BOTH:NV_OF_PRED_DIRECTION_FORWARD;',
                          '    init.predDirection=NV_OF_PRED_DIRECTION_FORWARD;')
          $s = $s.Replace('L" preset, no pre-flow graphics copy, backward consistency="+',
                          'L" preset, forward-only low-latency mode, confidence cost="+')
          $s = $s.Replace('(backward_?std::wstring(L"on"):std::wstring(L"off"))+L".");',
                          '(cost_?std::wstring(L"on"):std::wstring(L"off"))+L".");')
          Set-Content -Path $p -Value $s -NoNewline

          $p = Join-Path $root "main.cpp"
          $s = Get-Content $p -Raw
          $s = $s.Replace('Ultra low-latency DLSS FG v4 NVOFA.', 'Ultra low-latency DLSS FG v4.1 NVOFA.')
          $s = $s.Replace('Captured/base presents: ', 'Presenter/base throughput: ')
          $a = $s.IndexOf('            // LOW-LATENCY ORDER:')
          $b = $s.IndexOf('            DXGI_OUTDUPL_FRAME_INFO', $a)
          if ($a -lt 0 -or $b -lt 0) { throw 'Could not locate v4 pre-capture scheduling block' }
          $rep = @(
            '            // v4.1: no full-frame CPU wait before AcquireNextFrame.',
            '            // Streamline dependencies are GPU queued; D3D11 overwrite protection is GPU-side too.',
            '            gDLSS.BeforeFrame(d.queue.Get());',
            '            gDLSS.PrepareFrame();',
            '            if(c.lastRenderDone) HR(c.context4->Wait(c.sharedFence.Get(),c.lastRenderDone),"Capture overwrite protection");',
            ''
          ) -join [Environment]::NewLine
          $s = $s.Substring(0,$a) + $rep + $s.Substring($b)
          Set-Content -Path $p -Value $s -NoNewline

      - name: Get Streamline 2.14.1 headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git "$env:GITHUB_WORKSPACE\Streamline"

      - name: Get NVIDIA Optical Flow headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mbucchia/Optical-Flow-SDK.git "$env:GITHUB_WORKSPACE\OpticalFlow"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 Release
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\v4-source\source"
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c++20 /O2 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /I "%GITHUB_WORKSPACE%\Streamline\include" /I "%GITHUB_WORKSPACE%\OpticalFlow\NvOFInterface" main.cpp dlss_bridge.cpp nvof_bridge.cpp app.res /Fe:"%GITHUB_WORKSPACE%\LoLDX12Presenter-FG.exe" /link d3d12.lib d3d11.lib dxgi.lib d3dcompiler.lib dwmapi.lib comctl32.lib shell32.lib ole32.lib user32.lib gdi32.lib wintrust.lib crypt32.lib /SUBSYSTEM:WINDOWS

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LoLDX12Presenter-FG-Ultra-v4-1
          path: LoLDX12Presenter-FG.exe
          if-no-files-found: error
