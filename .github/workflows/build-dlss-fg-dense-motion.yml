name: Build Original Presenter NVOFA Q0 Max1

on:
  push:
    branches:
      - dlss-fg-original-nvofa-q0-max1
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct source base
        shell: pwsh
        run: |
          $b64 = (Get-Content .payload/0.txt -Raw) + (Get-Content .payload/1.txt -Raw) + (Get-Content .payload/2.txt -Raw) + (Get-Content .payload/3.txt -Raw)
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE/dense-src.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$env:GITHUB_WORKSPACE/dense-src.zip" "$env:GITHUB_WORKSPACE/dense-src" -Force

      - name: Install NVOFA motion module
        shell: pwsh
        run: |
          $src = "$env:GITHUB_WORKSPACE/dense-src/source"
          $bridge = ""
          0..3 | ForEach-Object {
            $bridge += Get-Content ("$env:GITHUB_WORKSPACE/nvof_overlay/dlss_bridge.cpp.{0:D2}" -f $_) -Raw
          }
          # Repair the two C++ escaped Windows path literals after text-chunk transport.
          $bridge = $bridge.Replace('VerifyRuntime(dir + L"\" + file);','VerifyRuntime(dir + L"\\" + file);')
          $bridge = $bridge.Replace('(dir+L"\sl.interposer.dll")','(dir+L"\\sl.interposer.dll")')
          # The NVIDIA DLL bytes are unchanged from the known-working package. Do not hard-fail
          # startup on WinVerifyTrust certificate-chain/cache state.
          $bridge = $bridge.Replace('VerifyRuntime(dir + L"\\" + file);','(void)file;')
          Set-Content -Path "$src/dlss_bridge.cpp" -Value $bridge -NoNewline
          Copy-Item "$env:GITHUB_WORKSPACE/nvof_overlay/motion_shader.h" "$src/motion_shader.h" -Force

          # Use the exact original HLSL for resample/software fallback. It is compiled
          # once at startup; the per-frame presenter path remains the original one.
          $bp = "$src/dlss_bridge.cpp"
          $blines = Get-Content $bp
          $bout = New-Object System.Collections.Generic.List[string]
          $skip = $false
          $done = $false
          foreach ($line in $blines) {
            if ($line -eq '#include "compute_bytecode.h"') {
              $bout.Add('#include "motion_shader.h"')
              $bout.Add('#include <cstring>')
              continue
            }
            if (-not $done -and $line.StartsWith('    auto pipeline=[&](const unsigned char* bytes')) {
              $skip = $true
              $bout.Add('    auto pipeline=[&](const char* entry,ComPtr<ID3D12PipelineState>& pso) {')
              $bout.Add('        ComPtr<ID3DBlob> code,compileErrors;')
              $bout.Add('        UINT flags=D3DCOMPILE_ENABLE_STRICTNESS|D3DCOMPILE_OPTIMIZATION_LEVEL3;')
              $bout.Add('        HRESULT hr=D3DCompile(kMotionShader,strlen(kMotionShader),"motion_shader.h",nullptr,nullptr,')
              $bout.Add('                              entry,"cs_5_0",flags,0,&code,&compileErrors);')
              $bout.Add('        if(FAILED(hr)) {')
              $bout.Add('            std::string detail=compileErrors ? std::string((const char*)compileErrors->GetBufferPointer(),compileErrors->GetBufferSize()) : std::string();')
              $bout.Add('            throw std::runtime_error(std::string("Compile ")+entry+" failed: "+detail);')
              $bout.Add('        }')
              $bout.Add('        D3D12_COMPUTE_PIPELINE_STATE_DESC pd{};pd.pRootSignature=root.Get();pd.CS={code->GetBufferPointer(),code->GetBufferSize()};')
              $bout.Add('        HR(dev->CreateComputePipelineState(&pd,IID_PPV_ARGS(&pso)),"Compute pipeline");')
              $bout.Add('    };')
              $bout.Add('    pipeline("Resample",resamplePSO);')
              $bout.Add('    pipeline("Motion",motionPSO);')
              continue
            }
            if ($skip) {
              if ($line -eq '    pipeline(motionCode,sizeof(motionCode),motionPSO);') {
                $skip = $false
                $done = $true
              }
              continue
            }
            $bout.Add($line)
          }
          if (-not $done) { throw 'Could not replace bytecode pipeline block' }
          Set-Content -Path $bp -Value $bout

          Copy-Item "$env:GITHUB_WORKSPACE/nvof_overlay/dlss_bridge.h" "$src/dlss_bridge.h" -Force
          Copy-Item "$env:GITHUB_WORKSPACE/nvof_overlay/nvof_bridge.h" "$src/nvof_bridge.h" -Force
          Copy-Item "$env:GITHUB_WORKSPACE/nvof_overlay/nvof_bridge.cpp" "$src/nvof_bridge.cpp" -Force

          $p = "$src/main.cpp"
          $lines = Get-Content $p
          $out = New-Object System.Collections.Generic.List[string]
          $addedPrepare = $false
          $addedWait = $false
          $skipNextFailedCheck = $false
          foreach ($line in $lines) {
            if ($skipNextFailedCheck -and $line -eq '    if (FAILED(hr)) return false;') {
              $out.Add($line)
              $out.Add('    if(!gDLSS.WaitMotion(d.queue.Get())) return false;')
              $addedWait = $true
              $skipNextFailedCheck = $false
              continue
            }
            if ($skipNextFailedCheck) { throw 'Unexpected line after shared fence wait' }

            $out.Add($line)
            if (-not $addedPrepare -and $line -eq '    gDLSS.BeforeFrame(d.queue.Get());') {
              $out.Add('    gDLSS.PrepareMotion(d.sharedFence.Get(),copyReady);')
              $addedPrepare = $true
            }
            if (-not $addedWait -and $line -eq '    hr = d.queue->Wait(d.sharedFence.Get(), copyReady);') {
              $skipNextFailedCheck = $true
            }
          }
          if (-not $addedPrepare) { throw 'Original BeforeFrame line not found' }
          if (-not $addedWait) { throw 'Original shared fence wait line not found' }
          Set-Content -Path $p -Value $out

          # Timing-only changes: no software backlog is added (queue target 0),
          # and force the DXGI swapchain maximum frame latency to 1.
          $p = "$src/main.cpp"
          $lines = Get-Content $p
          $out = New-Object System.Collections.Generic.List[string]
          $addedCreateLimit = $false
          $addedPresentLimit = $false
          foreach ($line in $lines) {
            if (-not $addedCreateLimit -and $line -eq '    D3D12_CPU_DESCRIPTOR_HANDLE handle = d.rtvHeap->GetCPUDescriptorHandleForHeapStart();') {
              $out.Add('    {')
              $out.Add('        ComPtr<IDXGISwapChain2> latencySwap;')
              $out.Add('        HRESULT latencyHr = d.swapchain.As(&latencySwap);')
              $out.Add('        if (FAILED(latencyHr)) return false;')
              $out.Add('        latencyHr = latencySwap->SetMaximumFrameLatency(1);')
              $out.Add('        if (FAILED(latencyHr)) { PostStatus(L"SetMaximumFrameLatency(1) failed: " + WinError(latencyHr)); return false; }')
              $out.Add('    }')
              $addedCreateLimit = $true
            }
            $out.Add($line)
            if (-not $addedPresentLimit -and $line -eq '    gDLSS.AfterPresent();') {
              $out.Add('    {')
              $out.Add('        ComPtr<IDXGISwapChain2> latencySwap;')
              $out.Add('        HRESULT latencyHr = d.swapchain.As(&latencySwap);')
              $out.Add('        if (FAILED(latencyHr)) return false;')
              $out.Add('        latencyHr = latencySwap->SetMaximumFrameLatency(1);')
              $out.Add('        if (FAILED(latencyHr)) return false;')
              $out.Add('    }')
              $addedPresentLimit = $true
            }
          }
          if (-not $addedCreateLimit) { throw 'Swapchain creation point not found for MaxFrameLatency=1' }
          if (-not $addedPresentLimit) { throw 'AfterPresent point not found for MaxFrameLatency=1' }
          Set-Content -Path $p -Value $out

      - name: Get Streamline headers
        shell: pwsh
        run: |
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git "$env:GITHUB_WORKSPACE/Streamline"

      - name: Get Optical Flow headers
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/mbucchia/Optical-Flow-SDK.git "$env:GITHUB_WORKSPACE/OpticalFlow"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build x64 Release
        shell: cmd
        run: |
          cd /d "%GITHUB_WORKSPACE%\dense-src\source"
          rc /nologo /fo app.res app.rc
          cl /nologo /std:c++20 /O2 /EHsc /W4 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /DWINVER=0x0A00 /I "%GITHUB_WORKSPACE%\Streamline\include" /I "%GITHUB_WORKSPACE%\OpticalFlow\NvOFInterface" main.cpp dlss_bridge.cpp nvof_bridge.cpp app.res /Fe:"%GITHUB_WORKSPACE%\LoLDX12Presenter-FG.exe" /link d3d12.lib d3d11.lib dxgi.lib d3dcompiler.lib dwmapi.lib comctl32.lib shell32.lib ole32.lib user32.lib gdi32.lib wintrust.lib crypt32.lib /SUBSYSTEM:WINDOWS

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: LoLDX12Presenter-FG-Original-NVOFA-Q0-Max1
          path: LoLDX12Presenter-FG.exe
          if-no-files-found: error
