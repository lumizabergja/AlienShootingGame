name: ChatGPT WGC1 Low Latency Build

on:
  push:
    branches:
      - chatgpt-wgc1-lowlatency
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Decode fresh source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "$pwd\.chatgpt\wgc1\part*.txt" | Sort-Object Name
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$pwd\source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$pwd\source.zip" "$pwd\source" -Force
          $main = Get-Content "$pwd\source\main.cpp" -Raw
          $main = $main.Replace('using namespace Windows::Graphics::Capture;', 'namespace wgc = winrt::Windows::Graphics::Capture;')
          $main = $main.Replace('using namespace Windows::Graphics::DirectX;', 'namespace wdx = winrt::Windows::Graphics::DirectX;')
          $main = $main.Replace('using namespace Windows::Graphics::DirectX::Direct3D11;', 'namespace wd3d = winrt::Windows::Graphics::DirectX::Direct3D11;')
          $main = $main.Replace('GraphicsCaptureSession::IsSupported()', 'wgc::GraphicsCaptureSession::IsSupported()')
          $main = $main.Replace('inspectable.as<IDirect3DDevice>()', 'inspectable.as<wd3d::IDirect3DDevice>()')
          $main = $main.Replace('get_activation_factory<GraphicsCaptureItem,IGraphicsCaptureItemInterop>()', 'get_activation_factory<wgc::GraphicsCaptureItem,IGraphicsCaptureItemInterop>()')
          $main = $main.Replace('guid_of<GraphicsCaptureItem>()', 'guid_of<wgc::GraphicsCaptureItem>()')
          $main = $main.Replace('Direct3D11CaptureFramePool::CreateFreeThreaded', 'wgc::Direct3D11CaptureFramePool::CreateFreeThreaded')
          $main = $main.Replace('DirectXPixelFormat::B8G8R8A8UIntNormalized', 'wdx::DirectXPixelFormat::B8G8R8A8UIntNormalized')
          $main = $main.Replace('void OnFrame(Direct3D11CaptureFramePool const& sender, IInspectable const&)', 'void OnFrame(wgc::Direct3D11CaptureFramePool const& sender, IInspectable const&)')
          $main = $main.Replace('void OnFrame(wgc::Direct3D11CaptureFramePool const& sender, IInspectable const&) noexcept', 'void OnFrame(wgc::Direct3D11CaptureFramePool const& sender, winrt::Windows::Foundation::IInspectable const&) noexcept')
          $main = $main.Replace('frame.Surface().as<IDirect3DDxgiInterfaceAccess>()', 'frame.Surface().as<::Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess>()')
          $main = $main.Replace('IDirect3DDevice winrtDev_{nullptr};GraphicsCaptureItem item_{nullptr};Direct3D11CaptureFramePool pool_{nullptr};GraphicsCaptureSession session_{nullptr};', 'wd3d::IDirect3DDevice winrtDev_{nullptr};wgc::GraphicsCaptureItem item_{nullptr};wgc::Direct3D11CaptureFramePool pool_{nullptr};wgc::GraphicsCaptureSession session_{nullptr};')
          $main = $main.Replace('(unsigned long long)(drops-lastDrops)/std::max(0.001,sec)', '(unsigned long long)((drops-lastDrops)/std::max(0.001,sec))')
          Set-Content "$pwd\source\main.cpp" -Value $main -Encoding UTF8
      - name: Apply D3D12-owned WGC interop fix
        shell: python
        run: |
          from pathlib import Path
          p=Path("source/main.cpp")
          s=p.read_text(encoding="utf-8-sig")
          old='''        D3D11_TEXTURE2D_DESC td{}; td.Width=width_;td.Height=height_;td.MipLevels=1;td.ArraySize=1;
                  td.Format=DXGI_FORMAT_B8G8R8A8_UNORM;td.SampleDesc.Count=1;td.Usage=D3D11_USAGE_DEFAULT;
                  td.BindFlags=D3D11_BIND_SHADER_RESOURCE|D3D11_BIND_RENDER_TARGET;
                  td.MiscFlags=D3D11_RESOURCE_MISC_SHARED_NTHANDLE;
                  HR(dev_->CreateTexture2D(&td,nullptr,&shared11_),"WGC shared texture");
                  ComPtr<IDXGIResource1> res; HR(shared11_.As(&res),"WGC shared IDXGIResource1");
                  HR(res->CreateSharedHandle(nullptr,DXGI_SHARED_RESOURCE_READ|DXGI_SHARED_RESOURCE_WRITE,nullptr,&texHandle_),"WGC shared texture handle");
                  HR(dev5_->CreateFence(0,D3D11_FENCE_FLAG_SHARED,IID_PPV_ARGS(&fence11_)),"WGC shared fence");
                  HR(fence11_->CreateSharedHandle(nullptr,GENERIC_ALL,nullptr,&fenceHandle_),"WGC shared fence handle");
          '''
          # Normalize indentation because the source uses 8 spaces, not the YAML indentation above.
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          if old not in s: raise SystemExit("old D3D11-owned interop block not found")
          s=s.replace(old,'',1)

          old='''    HANDLE TextureHandle()const{return texHandle_;}
              HANDLE FenceHandle()const{return fenceHandle_;}
              HANDLE FrameEvent()const{return frameEvent_;}
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''    void AttachShared(HANDLE textureHandle,HANDLE fenceHandle){
                  ComPtr<ID3D11Device1> dev1; HR(dev_.As(&dev1),"D3D11Device1 for shared interop");
                  HR(dev1->OpenSharedResource1(textureHandle,IID_PPV_ARGS(&shared11_)),"Open D3D12 shared texture in D3D11");
                  HR(dev5_->OpenSharedFence(fenceHandle,IID_PPV_ARGS(&fence11_)),"Open D3D12 shared fence in D3D11");
                  gLog.Write(L"WGC interop: D3D12-owned shared texture/fence opened in D3D11.");
              }
              HANDLE FrameEvent()const{return frameEvent_;}
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("old shared-handle getters not found")
          s=s.replace(old,new,1)

          for line in (
              '        if(texHandle_){CloseHandle(texHandle_);texHandle_=nullptr;}\n',
              '        if(fenceHandle_){CloseHandle(fenceHandle_);fenceHandle_=nullptr;}\n'):
              if line not in s: raise SystemExit("old handle close line not found")
              s=s.replace(line,'',1)
          old='    HANDLE texHandle_{},fenceHandle_{},frameEvent_{};\n'
          if old not in s: raise SystemExit("old handle member line not found")
          s=s.replace(old,'    HANDLE frameEvent_{};\n',1)

          old='    HR(d.device->OpenSharedHandle(cap.TextureHandle(),IID_PPV_ARGS(&d.shared)),"Open capture texture");HR(d.device->OpenSharedHandle(cap.FenceHandle(),IID_PPV_ARGS(&d.sharedFence)),"Open capture fence");\n'
          new='''    // D3D12 owns the interop surface. Create it shared, then open it from the WGC D3D11 device.
              D3D12_HEAP_PROPERTIES hp{};hp.Type=D3D12_HEAP_TYPE_DEFAULT;hp.CreationNodeMask=1;hp.VisibleNodeMask=1;
              D3D12_RESOURCE_DESC rd{};rd.Dimension=D3D12_RESOURCE_DIMENSION_TEXTURE2D;rd.Width=cap.Width();rd.Height=cap.Height();rd.DepthOrArraySize=1;rd.MipLevels=1;rd.Format=DXGI_FORMAT_B8G8R8A8_UNORM;rd.SampleDesc.Count=1;rd.Layout=D3D12_TEXTURE_LAYOUT_UNKNOWN;rd.Flags=D3D12_RESOURCE_FLAG_NONE;
              HR(d.device->CreateCommittedResource(&hp,D3D12_HEAP_FLAG_SHARED,&rd,D3D12_RESOURCE_STATE_COMMON,nullptr,IID_PPV_ARGS(&d.shared)),"Create D3D12-owned WGC interop texture");
              HR(d.device->CreateFence(0,D3D12_FENCE_FLAG_SHARED,IID_PPV_ARGS(&d.sharedFence)),"Create D3D12 shared capture fence");
              HANDLE textureHandle=nullptr,fenceHandle=nullptr;
              HR(d.device->CreateSharedHandle(d.shared.Get(),nullptr,GENERIC_ALL,nullptr,&textureHandle),"Share D3D12 WGC interop texture");
              try {
                  HR(d.device->CreateSharedHandle(d.sharedFence.Get(),nullptr,GENERIC_ALL,nullptr,&fenceHandle),"Share D3D12 capture fence");
                  cap.AttachShared(textureHandle,fenceHandle);
              } catch(...) {
                  if(textureHandle)CloseHandle(textureHandle);if(fenceHandle)CloseHandle(fenceHandle);throw;
              }
              CloseHandle(textureHandle);CloseHandle(fenceHandle);
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("old D3D12 OpenSharedHandle line not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Apply Streamline manual-hooking fix
        shell: python
        run: |
          from pathlib import Path

          h=Path("source/dlss_bridge.h")
          s=h.read_text(encoding="utf-8-sig")
          s=s.replace('    using FactoryFn = HRESULT(WINAPI*)(REFIID,void**);\n    using DeviceFn = HRESULT(WINAPI*)(IUnknown*,D3D_FEATURE_LEVEL,REFIID,void**);\n    FactoryFn factory{};\n    DeviceFn createDevice{};\n','')
          s=s.replace('    void BindDevice(ID3D12Device* d) {Check(setDevice(d),"slSetD3DDevice");}\n','    void BindDevice(ID3D12Device* d) {Check(setDevice(d),"slSetD3DDevice");}\n    void UpgradeInterface(void** p) {Check(upgradeInterface(p),"slUpgradeInterface");}\n')
          s=s.replace('    PFun_slSetD3DDevice* setDevice{};\n','    PFun_slSetD3DDevice* setDevice{};\n    PFun_slUpgradeInterface* upgradeInterface{};\n')
          h.write_text(s,encoding="utf-8")

          p=Path("source/dlss_bridge.cpp")
          s=p.read_text(encoding="utf-8-sig")
          s=s.replace('    Export(init,"slInit"); Export(shutdown,"slShutdown"); Export(setDevice,"slSetD3DDevice");\n','    Export(init,"slInit"); Export(shutdown,"slShutdown"); Export(setDevice,"slSetD3DDevice"); Export(upgradeInterface,"slUpgradeInterface");\n')
          s=s.replace('    Export(evaluate,"slEvaluateFeature");Export(freeResources,"slFreeResources");\n    Export(factory,"CreateDXGIFactory1"); Export(createDevice,"D3D12CreateDevice");\n','    Export(evaluate,"slEvaluateFeature");Export(freeResources,"slFreeResources");\n')
          s=s.replace('    p.flags=sl::PreferenceFlags::eDisableCLStateTracking|sl::PreferenceFlags::eUseFrameBasedResourceTagging|sl::PreferenceFlags::eUseDXGIFactoryProxy;\n','    p.flags=sl::PreferenceFlags::eDisableCLStateTracking|sl::PreferenceFlags::eUseFrameBasedResourceTagging|sl::PreferenceFlags::eUseManualHooking;\n')
          s=s.replace('    log(L"Streamline 2.14.1 initialized: DLSS SR all modes + DLSS Frame Generation fixed/auto/dynamic.");\n','    log(L"Streamline 2.14.1 initialized in manual-hooking mode: native D3D12 device + upgraded queue/factory/swapchain hooks.");\n')
          p.write_text(s,encoding="utf-8")

          p=Path("source/main.cpp")
          s=p.read_text(encoding="utf-8-sig")
          s=s.replace('    HRESULT hr=gDLSS.factory(IID_PPV_ARGS(&f));if(FAILED(hr)){PostStatus(L"DXGI factory: "+HrText(hr));return false;}\n','    HRESULT hr=CreateDXGIFactory2(0,IID_PPV_ARGS(&f));if(FAILED(hr)){PostStatus(L"DXGI factory: "+HrText(hr));return false;}\n')
          old='''bool App::InitDx12(HWND output,WgcCapture& cap,IDXGIAdapter1* adapter,const Settings&s,Dx12State& d){
              if(!adapter)return false;
              HR(CreateDXGIFactory2(0,IID_PPV_ARGS(&d.factory)),"DXGI factory");
              d.adapter=adapter;
              HR(gDLSS.createDevice(d.adapter.Get(),D3D_FEATURE_LEVEL_11_0,IID_PPV_ARGS(&d.device)),"Streamline D3D12 device");gDLSS.BindDevice(d.device.Get());
              D3D12_COMMAND_QUEUE_DESC q{};q.Type=D3D12_COMMAND_LIST_TYPE_DIRECT;q.Priority=D3D12_COMMAND_QUEUE_PRIORITY_NORMAL;HR(d.device->CreateCommandQueue(&q,IID_PPV_ARGS(&d.queue)),"DX12 queue");
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          new='''bool App::InitDx12(HWND output,WgcCapture& cap,IDXGIAdapter1* adapter,const Settings&s,Dx12State& d){
              if(!adapter)return false;
              d.adapter=adapter;

              // Streamline manual-hooking mode: native device first, then only required proxies.
              ComPtr<ID3D12Device> nativeDevice;
              HR(D3D12CreateDevice(d.adapter.Get(),D3D_FEATURE_LEVEL_11_0,IID_PPV_ARGS(&nativeDevice)),"Native D3D12 device");
              gDLSS.BindDevice(nativeDevice.Get());
              ID3D12Device* proxyDevice=nativeDevice.Get();
              gDLSS.UpgradeInterface(reinterpret_cast<void**>(&proxyDevice));
              d.device=proxyDevice;

              ComPtr<IDXGIFactory6> nativeFactory;
              HR(CreateDXGIFactory2(0,IID_PPV_ARGS(&nativeFactory)),"Native DXGI factory");
              IDXGIFactory6* proxyFactory=nativeFactory.Get();
              gDLSS.UpgradeInterface(reinterpret_cast<void**>(&proxyFactory));
              d.factory=proxyFactory;

              D3D12_COMMAND_QUEUE_DESC q{};q.Type=D3D12_COMMAND_LIST_TYPE_DIRECT;q.Priority=D3D12_COMMAND_QUEUE_PRIORITY_NORMAL;HR(d.device->CreateCommandQueue(&q,IID_PPV_ARGS(&d.queue)),"DX12 queue");
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("InitDx12 integration block not found")
          s=s.replace(old,new,1)
          p.write_text(s,encoding="utf-8")
      - name: Fetch current NVIDIA headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git "$pwd\ext\streamline"
          New-Item -ItemType Directory -Force -Path "$pwd\ext\nvof" | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/SlimRG/NvidiaOF5/main/nvOpticalFlowCommon.h" -OutFile "$pwd\ext\nvof\nvOpticalFlowCommon.h"
          Invoke-WebRequest "https://raw.githubusercontent.com/SlimRG/NvidiaOF5/main/nvOpticalFlowD3D12.h" -OutFile "$pwd\ext\nvof\nvOpticalFlowD3D12.h"
      - name: Compile x64 Release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$pwd\build" | Out-Null
          rc /nologo /fo "$pwd\build\app.res" "$pwd\source\app.rc"
          if ($LASTEXITCODE -ne 0) { throw "rc failed" }
          cl /nologo /std:c++20 /O2 /EHsc /utf-8 /permissive- /W3 /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN /D_WIN32_WINNT=0x0A00 /I "$pwd\ext\streamline\include" /I "$pwd\ext\nvof" "$pwd\source\main.cpp" "$pwd\source\dlss_bridge.cpp" "$pwd\source\nvof_bridge.cpp" "$pwd\build\app.res" /Fe:"$pwd\build\DLSS-WGC1-LowLatency.exe" /link d3d11.lib d3d12.lib dxgi.lib d3dcompiler.lib user32.lib gdi32.lib comctl32.lib wintrust.lib crypt32.lib ole32.lib shell32.lib windowsapp.lib runtimeobject.lib avrt.lib
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: DLSS-WGC1-LowLatency-build
          path: build/DLSS-WGC1-LowLatency.exe
          if-no-files-found: error
