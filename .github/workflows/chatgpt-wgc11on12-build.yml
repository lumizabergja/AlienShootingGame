name: ChatGPT WGC D3D11On12 Zero Copy Build

on:
  push:
    branches:
      - chatgpt-wgc1-freezefix-native
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Decode source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "$pwd\.chatgpt\wgc11on12\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 5) { throw "Expected 5 source chunks, found $($parts.Count)" }
          $b64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$pwd\source.zip", [Convert]::FromBase64String($b64))
          Expand-Archive "$pwd\source.zip" "$pwd\source" -Force
          # Restore unchanged helper files from the already build-verified WGC baseline.
          $baseParts = Get-ChildItem "$pwd\.chatgpt\wgc1\part*.txt" | Sort-Object Name
          $baseB64 = ($baseParts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ""
          [IO.File]::WriteAllBytes("$pwd\baseline.zip", [Convert]::FromBase64String($baseB64))
          Expand-Archive "$pwd\baseline.zip" "$pwd\baseline" -Force
          @("nvof_bridge.cpp","nvof_bridge.h","motion_shader.h","app.manifest","app.rc") | ForEach-Object {
            Copy-Item "$pwd\baseline\$_" "$pwd\source\$_" -Force
          }

      - name: Apply one-buffer release-before-DLSS fix
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("source/main.cpp")
          s=p.read_text(encoding="utf-8-sig")

          s=s.replace('WGC CreateFreeThreaded on D3D11On12: 1 physical buffer, 0 software queue, direct D3D12 unwrap, no capture copy.',
                      'WGC CreateFreeThreaded on D3D11On12: 1 physical buffer, 0 software queue. Frames are copied GPU-only into a persistent D3D12 input and released immediately.')

          s=s.replace('        on12_.Reset();ctx_.Reset();dev_.Reset();',
                      '        input11_.Reset();input12_.Reset();on12_.Reset();ctx_.Reset();dev_.Reset();',1)

          pat=r'''    void Unwrap\(wgc::Direct3D11CaptureFrame const& frame, ID3D12CommandQueue\* queue,.*?^    }\n    void Return\(ID3D11Texture2D\* tex11, ID3D12Fence\* fence, uint64_t value\)\{.*?^    }\n'''
          rep='''    void CreatePersistentInput(ID3D12Device* d12){
              D3D12_HEAP_PROPERTIES hp{};hp.Type=D3D12_HEAP_TYPE_DEFAULT;hp.CreationNodeMask=1;hp.VisibleNodeMask=1;
              D3D12_RESOURCE_DESC rd{};rd.Dimension=D3D12_RESOURCE_DIMENSION_TEXTURE2D;rd.Width=width_;rd.Height=height_;rd.DepthOrArraySize=1;rd.MipLevels=1;
              rd.Format=DXGI_FORMAT_B8G8R8A8_UNORM;rd.SampleDesc.Count=1;rd.Layout=D3D12_TEXTURE_LAYOUT_UNKNOWN;rd.Flags=D3D12_RESOURCE_FLAG_NONE;
              HR(d12->CreateCommittedResource(&hp,D3D12_HEAP_FLAG_NONE,&rd,D3D12_RESOURCE_STATE_COMMON,nullptr,IID_PPV_ARGS(&input12_)),"Create persistent D3D12 capture input");
              D3D11_RESOURCE_FLAGS rf{};rf.BindFlags=D3D11_BIND_SHADER_RESOURCE;
              HR(on12_->CreateWrappedResource(input12_.Get(),&rf,D3D12_RESOURCE_STATE_COPY_DEST,D3D12_RESOURCE_STATE_COMMON,IID_PPV_ARGS(&input11_)),"Wrap persistent capture input for D3D11On12");
              gLog.Write(L"Capture bridge: one persistent D3D12 BGRA8 input, GPU-only D3D11On12 copy, WGC frame released immediately.");
          }
          ID3D12Resource* Input12()const{return input12_.Get();}
          void CopyFrameToPersistent(wgc::Direct3D11CaptureFrame& frame){
              if(!frame||!input11_) throw std::runtime_error("Capture input is not ready.");
              ComPtr<ID3D11Texture2D> src11;
              auto access=frame.Surface().as<::Windows::Graphics::DirectX::Direct3D11::IDirect3DDxgiInterfaceAccess>();
              check_hresult(access->GetInterface(IID_PPV_ARGS(src11.ReleaseAndGetAddressOf())));
              ID3D11Resource* wrapped[]={input11_.Get()};
              on12_->AcquireWrappedResources(wrapped,1);
              ctx_->CopyResource(input11_.Get(),src11.Get());
              on12_->ReleaseWrappedResources(wrapped,1);
              ctx_->Flush();
              src11.Reset();
              frame.Close();frame=nullptr;
          }
          '''
          s,n=re.subn(pat,rep,s,count=1,flags=re.S|re.M)
          if n!=1: raise SystemExit("capture unwrap/return block not found")

          s=s.replace('    ComPtr<ID3D11Device> dev_;ComPtr<ID3D11DeviceContext> ctx_;ComPtr<ID3D11On12Device2> on12_;',
                      '    ComPtr<ID3D11Device> dev_;ComPtr<ID3D11DeviceContext> ctx_;ComPtr<ID3D11On12Device2> on12_;\n    ComPtr<ID3D12Resource> input12_;ComPtr<ID3D11Resource> input11_;',1)

          s,n=re.subn(r'    bool RenderOne\(WgcCapture& cap,Dx12State& d,wgc::Direct3D11CaptureFrame& frame,ID3D11Texture2D\* tex11,ID3D12Resource\* source,',
                      '    bool RenderOne(WgcCapture& cap,Dx12State& d,ID3D12Resource* source,',s,count=1)
          if n!=1: raise SystemExit("RenderOne declaration not found")
          s,n=re.subn(r'bool App::RenderOne\(WgcCapture& cap,Dx12State& d,wgc::Direct3D11CaptureFrame& frame,ID3D11Texture2D\* tex11,ID3D12Resource\* source,',
                      'bool App::RenderOne(WgcCapture& cap,Dx12State& d,ID3D12Resource* source,',s,count=1)
          if n!=1: raise SystemExit("RenderOne definition not found")

          s=s.replace('    // Signal the exact point at which the WGC texture is back in COMMON and no longer used by our D3D12 work.\n',
                      '    // Persistent input becomes reusable when this fence completes. No CPU wait is inserted.\n',1)
          s=s.replace('    cap.Return(tex11,d.frameFence.Get(),d.frameValue);\n    frame.Close(); frame=nullptr;\n','',1)

          old='        UINT cw=0,ch=0;cap.Init(target,d.device.Get(),d.queue.Get(),cw,ch);cap.SetCursor(s.cursor);cap.Start();\n        PostStatus(L"RUNNING: WGC1 D3D11On12 direct unwrap / 0 copy / queue 0 / one real frame in flight");\n'
          new='''        UINT cw=0,ch=0;cap.Init(target,d.device.Get(),d.queue.Get(),cw,ch);cap.SetCursor(s.cursor);cap.CreatePersistentInput(d.device.Get());
              PostStatus(L"Initializing DLSS / MFG before capture starts...");
              gDLSS.Init(d.device.Get(),d.adapter.Get(),cap.Input12(),cap.Width(),cap.Height(),d.width,d.height,s.sr,s.preset,s.fg,s.multiplier,s.dynamicTarget,s.boost,s.nvof);
              D3D12_SHADER_RESOURCE_VIEW_DESC v{};v.Format=DXGI_FORMAT_R16G16B16A16_FLOAT;v.ViewDimension=D3D12_SRV_DIMENSION_TEXTURE2D;v.Shader4ComponentMapping=D3D12_DEFAULT_SHADER_4_COMPONENT_MAPPING;v.Texture2D.MipLevels=1;
              d.device->CreateShaderResourceView(gDLSS.result.Get(),&v,d.srvHeap->GetCPUDescriptorHandleForHeapStart());d.dlssReady=true;
              cap.Start();
              PostStatus(L"RUNNING: WGC1 / 1 buffer / immediate GPU copy / frame released before DLSS / queue 0");
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("worker init sequence not found")
          s=s.replace(old,new,1)

          pat=r'''            ComPtr<ID3D11Texture2D> tex11;ComPtr<ID3D12Resource> source12;.*?            if\(!RenderOne\(cap,d,frame,tex11\.Get\(\),source12\.Get\(\),s,cq,ageSum,ageMax,ageN\)\)throw std::runtime_error\("Present failed\."\);\+\+frames;\n'''
          rep='''            cap.CopyFrameToPersistent(frame); // release the 1-buffer WGC frame before DLSS/MFG work
              if(!RenderOne(cap,d,cap.Input12(),s,cq,ageSum,ageMax,ageN))throw std::runtime_error("Present failed.");++frames;
          '''
          rep='\n'.join(line[10:] if line.startswith('          ') else line for line in rep.splitlines())+'\n'
          s,n=re.subn(pat,rep,s,count=1,flags=re.S)
          if n!=1: raise SystemExit("per-frame direct unwrap block not found")

          s=s.replace('D3D11On12 direct unwrap | %s','WGC released before DLSS | persistent D3D12 input | %s',1)
          p.write_text(s,encoding="utf-8")

      - name: Fix FG required inputs and startup arming
        shell: python
        run: |
          from pathlib import Path

          h=Path("source/dlss_bridge.h")
          s=h.read_text(encoding="utf-8-sig")
          old='    bool suspended{};\n    bool framePrepared{};\n'
          if old not in s: raise SystemExit("fgArmed insertion point not found")
          s=s.replace(old,'    bool suspended{};\n    bool framePrepared{};\n    bool fgArmed{};\n',1)
          h.write_text(s,encoding="utf-8")

          p=Path("source/dlss_bridge.cpp")
          s=p.read_text(encoding="utf-8-sig")

          old='        activeOptions=go;suspended=false;framePrepared=false;reportCalls=reportPresents=0;reportResult=sl::Result::eOk;reportStatus=sl::DLSSGStatus::eOk;\n        Check(fgOptions(viewport,go),"Enable selected NVIDIA Frame Generation mode");\n'
          new='        activeOptions=go;suspended=false;framePrepared=false;fgArmed=false;reportCalls=reportPresents=0;reportResult=sl::Result::eOk;reportStatus=sl::DLSSGStatus::eOk;\n        sl::DLSSGOptions warmup=go;warmup.mode=sl::DLSSGMode::eOff;\n        Check(fgOptions(viewport,warmup),"Initialize Frame Generation disabled for one-frame warmup");\n'
          if old not in s: raise SystemExit("FG enable block not found")
          s=s.replace(old,new,1)

          old='        Transition(list,result.Get(),D3D12_RESOURCE_STATE_COPY_DEST,D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE);\n        Transition(list,current.Get(),D3D12_RESOURCE_STATE_COPY_SOURCE,read);\n    }\n    if(fg) {\n'
          new='''        Transition(list,result.Get(),D3D12_RESOURCE_STATE_COPY_DEST,D3D12_RESOURCE_STATE_PIXEL_SHADER_RESOURCE);
              Transition(list,current.Get(),D3D12_RESOURCE_STATE_COPY_SOURCE,read);
          }
          if(fg && !sr) {
              // DLSS-G requires depth and motion vectors even when DLSS Super Resolution is disabled.
              sl::Resource dr(sl::ResourceType::eTex2d,depth.Get(),read),mv(sl::ResourceType::eTex2d,motion.Get(),read);
              dr.width=mv.width=rw;dr.height=mv.height=rh;
              dr.nativeFormat=DXGI_FORMAT_R32_FLOAT;mv.nativeFormat=DXGI_FORMAT_R16G16_FLOAT;
              sl::ResourceTag fgInputs[]={
                  {&dr,sl::kBufferTypeDepth,sl::eValidUntilPresent,&input},
                  {&mv,sl::kBufferTypeMotionVectors,sl::eValidUntilPresent,&input}
              };
              Check(tags(*token,viewport,fgInputs,2,list),"Tag DLSS-G depth and motion vectors");
          }
          if(fg) {
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("SR-off FG tag insertion point not found")
          s=s.replace(old,new,1)

          old='void DlssExperiment::AfterPresent() {\n    if (!fg) return;\n    sl::DLSSGState state{};\n'
          new='''void DlssExperiment::AfterPresent() {
              if (!fg) return;
              if (!fgArmed) {
                  Check(fgOptions(viewport,activeOptions),"Arm selected Frame Generation mode after warmup present");
                  fgArmed=true;
                  log(L"Frame Generation armed after one native warm-up present; required depth/motion/HUD-less inputs are active.");
                  return;
              }
              sl::DLSSGState state{};
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          if old not in s: raise SystemExit("AfterPresent block not found")
          s=s.replace(old,new,1)

          old='    inputFence.Reset();inputFenceValue=0;\n'
          if old not in s: raise SystemExit("release reset block not found")
          s=s.replace(old,'    inputFence.Reset();inputFenceValue=0;fgArmed=false;\n',1)

          p.write_text(s,encoding="utf-8")
      - name: Fix manual-hook native/proxy split and safe WGC1 copy release
        shell: python
        run: |
          from pathlib import Path
          import re

          # Streamline: expose slGetNativeInterface so only hooked APIs use proxies.
          h=Path("source/dlss_bridge.h")
          s=h.read_text(encoding="utf-8-sig")
          old='    void UpgradeInterface(void** p) {Check(upgradeInterface(p),"slUpgradeInterface");}\n'
          if old not in s: raise SystemExit("UpgradeInterface declaration not found")
          s=s.replace(old,old+'    void GetNativeInterface(void* proxy, void** native) {Check(getNativeInterface(proxy,native),"slGetNativeInterface");}\n',1)
          old='    PFun_slUpgradeInterface* upgradeInterface{};\n'
          if old not in s: raise SystemExit("upgradeInterface member not found")
          s=s.replace(old,old+'    PFun_slGetNativeInterface* getNativeInterface{};\n',1)
          h.write_text(s,encoding="utf-8")

          p=Path("source/dlss_bridge.cpp")
          s=p.read_text(encoding="utf-8-sig")
          old='Export(init,"slInit"); Export(shutdown,"slShutdown"); Export(setDevice,"slSetD3DDevice"); Export(upgradeInterface,"slUpgradeInterface");'
          if old not in s: raise SystemExit("Streamline export line not found")
          s=s.replace(old,old+' Export(getNativeInterface,"slGetNativeInterface");',1)
          p.write_text(s,encoding="utf-8")

          # D3D11On12/WGC: one physical frame, but don't return it to WGC until
          # the GPU-local copy into the persistent D3D12 input has actually completed.
          p=Path("source/main.cpp")
          s=p.read_text(encoding="utf-8-sig")

          old='        HR(dev_.As(&on12_),"ID3D11On12Device2");\n'
          if old not in s: raise SystemExit("D3D11On12 init point not found")
          new=old+'''        d12Queue_=queue;
              HR(d12->CreateFence(0,D3D12_FENCE_FLAG_NONE,IID_PPV_ARGS(&copyFence_)),"Create WGC copy-completion fence");
              copyEvent_=CreateEventW(nullptr,FALSE,FALSE,nullptr);
              if(!copyEvent_) throw std::runtime_error("Could not create WGC copy-completion event.");
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          old='        if(frameEvent_){SetEvent(frameEvent_);CloseHandle(frameEvent_);frameEvent_=nullptr;}\n        input11_.Reset();input12_.Reset();on12_.Reset();ctx_.Reset();dev_.Reset();\n'
          if old not in s: raise SystemExit("WGC Stop cleanup block not found")
          new='''        if(frameEvent_){SetEvent(frameEvent_);CloseHandle(frameEvent_);frameEvent_=nullptr;}
              if(copyEvent_){SetEvent(copyEvent_);CloseHandle(copyEvent_);copyEvent_=nullptr;}
              input11_.Reset();input12_.Reset();copyFence_.Reset();d12Queue_.Reset();on12_.Reset();ctx_.Reset();dev_.Reset();
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          old='''        on12_->ReleaseWrappedResources(wrapped,1);
              ctx_->Flush();
              src11.Reset();
              frame.Close();frame=nullptr;
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          if old not in s: raise SystemExit("WGC copy release block not found")
          new='''        on12_->ReleaseWrappedResources(wrapped,1);
              ctx_->Flush();

              // With exactly one WGC buffer, returning the frame before this copy
              // completes allows Windows to overwrite the same surface. Wait only
              // for this tiny GPU copy; DLSS/MFG remains asynchronous afterwards.
              const uint64_t value=++copyValue_;
              HR(d12Queue_->Signal(copyFence_.Get(),value),"Signal WGC copy completion");
              if(copyFence_->GetCompletedValue()<value){
                  HR(copyFence_->SetEventOnCompletion(value,copyEvent_),"Arm WGC copy completion event");
                  DWORD wr=WaitForSingleObject(copyEvent_,500);
                  if(wr!=WAIT_OBJECT_0) throw std::runtime_error("WGC GPU copy did not complete within 500 ms.");
              }
              src11.Reset();
              frame.Close();frame=nullptr;
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          old='    ComPtr<ID3D12Resource> input12_;ComPtr<ID3D11Resource> input11_;\n    HANDLE frameEvent_{};\n'
          if old not in s: raise SystemExit("WGC member insertion point not found")
          new='''    ComPtr<ID3D12Resource> input12_;ComPtr<ID3D11Resource> input11_;
              ComPtr<ID3D12CommandQueue> d12Queue_;ComPtr<ID3D12Fence> copyFence_;
              HANDLE frameEvent_{},copyEvent_{};uint64_t copyValue_{};
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          s=s.replace('Capture bridge: one persistent D3D12 BGRA8 input, GPU-only D3D11On12 copy, WGC frame released immediately.',
                      'Capture bridge: WGC1 GPU copy is fenced before the single capture surface is returned; DLSS/MFG stays asynchronous.',1)

          # Keep native interfaces for all ordinary D3D12 work. Proxies are retained
          # only for the methods NVIDIA lists as Streamline hooks.
          old='''struct Dx12State {
              ComPtr<IDXGIFactory6> factory;ComPtr<IDXGIAdapter1> adapter;ComPtr<ID3D12Device> device;ComPtr<ID3D12CommandQueue> queue;
              ComPtr<IDXGISwapChain3> swap;ComPtr<ID3D12DescriptorHeap> rtvHeap,srvHeap;
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          if old not in s: raise SystemExit("Dx12State header not found")
          new='''struct Dx12State {
              ComPtr<IDXGIFactory6> factory,proxyFactory;ComPtr<IDXGIAdapter1> adapter;
              ComPtr<ID3D12Device> device,proxyDevice;ComPtr<ID3D12CommandQueue> queue,proxyQueue;
              ComPtr<IDXGISwapChain3> swap;ComPtr<ID3D12DescriptorHeap> rtvHeap,srvHeap;
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          old='''    BOOL allow=FALSE;d.factory->CheckFeatureSupport(DXGI_FEATURE_PRESENT_ALLOW_TEARING,&allow,sizeof(allow));d.tearing=allow==TRUE&&!s.vsync;
              DXGI_SWAP_CHAIN_DESC1 sd{};sd.Width=d.width;sd.Height=d.height;sd.Format=DXGI_FORMAT_B8G8R8A8_UNORM;sd.SampleDesc.Count=1;sd.BufferUsage=DXGI_USAGE_RENDER_TARGET_OUTPUT;sd.BufferCount=kBackBufferCount;sd.SwapEffect=DXGI_SWAP_EFFECT_FLIP_DISCARD;sd.AlphaMode=DXGI_ALPHA_MODE_IGNORE;sd.Scaling=DXGI_SCALING_STRETCH;sd.Flags=d.tearing?DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING:0;
              ComPtr<IDXGISwapChain1> tmp;HR(d.factory->CreateSwapChainForHwnd(d.queue.Get(),out,&sd,nullptr,nullptr,&tmp),"Create flip swapchain");HR(tmp.As(&d.swap),"Swapchain3");d.factory->MakeWindowAssociation(out,DXGI_MWA_NO_ALT_ENTER);
              if(s.fg==sl::DLSSGMode::eOff){ComPtr<IDXGISwapChain2>x;if(SUCCEEDED(d.swap.As(&x)))x->SetMaximumFrameLatency(1);} // FG path uses Reflex pacing instead.
          '''
          old='\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines())+'\n'
          if old not in s: raise SystemExit("CreateSwapchain integration block not found")
          new='''    BOOL allow=FALSE;d.factory->CheckFeatureSupport(DXGI_FEATURE_PRESENT_ALLOW_TEARING,&allow,sizeof(allow));d.tearing=allow==TRUE&&!s.vsync;
              DXGI_SWAP_CHAIN_DESC1 sd{};sd.Width=d.width;sd.Height=d.height;sd.Format=DXGI_FORMAT_B8G8R8A8_UNORM;sd.SampleDesc.Count=1;sd.BufferUsage=DXGI_USAGE_RENDER_TARGET_OUTPUT;sd.BufferCount=kBackBufferCount;sd.SwapEffect=DXGI_SWAP_EFFECT_FLIP_DISCARD;sd.AlphaMode=DXGI_ALPHA_MODE_IGNORE;sd.Scaling=DXGI_SCALING_STRETCH;sd.Flags=d.tearing?DXGI_SWAP_CHAIN_FLAG_ALLOW_TEARING:0;
              ComPtr<IDXGISwapChain1> tmp;
              HR(d.proxyFactory->CreateSwapChainForHwnd(d.proxyQueue.Get(),out,&sd,nullptr,nullptr,&tmp),"Create Streamline-hooked flip swapchain");
              HR(tmp.As(&d.swap),"Streamline proxy Swapchain3");
              d.factory->MakeWindowAssociation(out,DXGI_MWA_NO_ALT_ENTER);
              // Do not call SetMaximumFrameLatency on this proxy. With the DLSS-G plugin loaded
              // and no FRAME_LATENCY_WAITABLE_OBJECT flag, Streamline owns the pacing object.
          '''
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())+'\n'
          s=s.replace(old,new,1)

          pat=r'''bool App::InitDx12\(HWND output,IDXGIAdapter1\* adapter,const Settings&s,Dx12State& d\)\{
              if\(!adapter\)return false;
              d\.adapter=adapter;
.*?              D3D12_DESCRIPTOR_HEAP_DESC rh\{\};'''
          m=re.search(pat,s,flags=re.S)
          if not m: raise SystemExit("InitDx12 proxy/device block not found")
          replacement='''bool App::InitDx12(HWND output,IDXGIAdapter1* adapter,const Settings&s,Dx12State& d){
              if(!adapter)return false;
              d.adapter=adapter;

              // NVIDIA manual-hooking rule: keep the native interfaces for ordinary work.
              HR(D3D12CreateDevice(d.adapter.Get(),D3D_FEATURE_LEVEL_11_0,IID_PPV_ARGS(&d.device)),"Native D3D12 device");
              gDLSS.BindDevice(d.device.Get());

              ID3D12Device* upgradedDevice=d.device.Get();
              gDLSS.UpgradeInterface(reinterpret_cast<void**>(&upgradedDevice));
              d.proxyDevice.Attach(upgradedDevice);

              HR(CreateDXGIFactory2(0,IID_PPV_ARGS(&d.factory)),"Native DXGI factory");
              IDXGIFactory6* upgradedFactory=d.factory.Get();
              gDLSS.UpgradeInterface(reinterpret_cast<void**>(&upgradedFactory));
              d.proxyFactory.Attach(upgradedFactory);

              D3D12_COMMAND_QUEUE_DESC q{};q.Type=D3D12_COMMAND_LIST_TYPE_DIRECT;q.Priority=D3D12_COMMAND_QUEUE_PRIORITY_NORMAL;
              HR(d.proxyDevice->CreateCommandQueue(&q,IID_PPV_ARGS(&d.proxyQueue)),"Streamline-hooked command queue creation");
              ID3D12CommandQueue* nativeQueue=nullptr;
              gDLSS.GetNativeInterface(d.proxyQueue.Get(),reinterpret_cast<void**>(&nativeQueue));
              d.queue.Attach(nativeQueue);

              D3D12_DESCRIPTOR_HEAP_DESC rh{};'''
          replacement='\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          s=s[:m.start()]+replacement+s[m.end():]

          # Full-frame FG does not need an explicit kBufferTypeBackbuffer tag.
          old='    gDLSS.TagBackbuffer(d.list.Get(),d.back[bi].Get(),D3D12_RESOURCE_STATE_RENDER_TARGET);\n'
          if old not in s: raise SystemExit("explicit backbuffer tag call not found")
          s=s.replace(old,'',1)

          s=s.replace('RUNNING: WGC1 / 1 buffer / immediate GPU copy / frame released before DLSS / queue 0',
                      'RUNNING: WGC1 / safe copy fence / native D3D12 work / Streamline proxy only for hooked Present path',1)

          p.write_text(s,encoding="utf-8")
      - name: Fetch current NVIDIA headers
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          git clone --depth 1 --branch v2.14.1 https://github.com/NVIDIA-RTX/Streamline.git "$pwd\ext\streamline"
          New-Item -ItemType Directory -Force -Path "$pwd\ext\nvof" | Out-Null
          Invoke-WebRequest "https://raw.githubusercontent.com/SlimRG/NvidiaOF5/main/nvOpticalFlowCommon.h" -OutFile "$pwd\ext\nvof\nvOpticalFlowCommon.h"
          Invoke-WebRequest "https://raw.githubusercontent.com/SlimRG/NvidiaOF5/main/nvOpticalFlowD3D12.h" -OutFile "$pwd\ext\nvof\nvOpticalFlowD3D12.h"

      - name: Compile x64 Release
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "$pwd\build" | Out-Null
          rc /nologo /fo "$pwd\build\app.res" "$pwd\source\app.rc"
