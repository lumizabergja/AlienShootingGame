name: Build direct NGX DLSS-G plus Frame Warp experiment

on:
  workflow_dispatch:
  push:
    branches:
      - experiment-ngx-dlssg-framewarp-20261107

jobs:
  compile:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get audited upstream JustFlow source
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/wealdly/JustFlow.git upstream
          git -C upstream checkout 99bf6484484345096ba5f044db057f3a8a86d6dc
          git -C upstream apply "$env:GITHUB_WORKSPACE\justflow-ngx-stack.patch"
      - name: Configure Windows x64
        shell: pwsh
        run: |
          cmake -S upstream -B build -G "Visual Studio 17 2022" -A x64 -DWINSDK_VER=10.0.26100.0
      - name: Build executable
        shell: pwsh
        run: |
          cmake --build build --config Release --target justflow --parallel 4
      - name: Package self-contained application shell
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifact -Force | Out-Null
          Copy-Item "build\Release\justflow.exe" artifact\
          Copy-Item "build\Release\nvngx.dll_justflow.dll" artifact\
          Copy-Item "upstream\RUN-NGX-STACK-CS2.cmd" artifact\
          Copy-Item "upstream\NGX-STACK-EXPERIMENT.md" artifact\
          Copy-Item "upstream\LICENSE" artifact\
          Copy-Item "upstream\NOTICE" artifact\
          Copy-Item "upstream\justflow.ini" artifact\
          Copy-Item "upstream\profiles" "artifact\profiles" -Recurse
          Compress-Archive -Path "artifact\*" -DestinationPath NGX-Stack-Experimental-Windows-x64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: NGX-Stack-Experimental-Windows-x64
          path: NGX-Stack-Experimental-Windows-x64.zip
          retention-days: 7
