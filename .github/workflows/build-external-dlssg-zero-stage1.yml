name: Build ExternalDLSSG Zero Stage1

on:
  push:
    branches:
      - chatgpt-external-dlssg-from-zero-20261011
    paths:
      - '.ci/from_zero_stage1/**'
      - '.github/workflows/build-external-dlssg-zero-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - name: Checkout isolated from-zero branch
        uses: actions/checkout@v4

      - name: Validate direct clean Stage 1 source
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $src=(Resolve-Path '.ci/from_zero_stage1').Path
          "SRC=$src" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $head=(git rev-parse HEAD).Trim()
          Write-Host "Building exact source commit: $head"
          $main=Join-Path $src 'src/main.cpp'
          $cmake=Join-Path $src 'CMakeLists.txt'
          $setup=Join-Path $src 'tools/setup_streamline.ps1'
          foreach($p in @($main,$cmake,$setup)){ if(-not(Test-Path $p)){ throw "Required clean source missing: $p" } }
          foreach($needle in @('#include <sl_helpers.h>','slInit(prefs, sl::kSDKVersion)','ORDER_PROOF: slInit completed before CreateDXGIFactory2 or D3D12CreateDevice','slSetD3DDevice(device_.Get())','CreateSwapChainForHwnd')){
            if(-not(Select-String -Path $main -SimpleMatch $needle -Quiet)){ throw "Stage1 source assertion missing: $needle" }
          }
          $cmakeText=Get-Content $cmake -Raw
          foreach($forbidden in @('dxgi.lib','d3d11.lib','d3d12.lib')){ if($cmakeText -match [regex]::Escape($forbidden) -and $cmakeText -notmatch ('do NOT link '+[regex]::Escape($forbidden))){ throw "Forbidden direct graphics library referenced: $forbidden" } }
          Write-Host 'Direct source assertions passed.'

      - name: Download and checksum-verify official Streamline 2.14.1
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          & "$env:SRC/tools/setup_streamline.ps1"

      - name: Configure Visual Studio 2022 x64 Release
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake -S "$env:SRC" -B "$env:SRC/build" -A x64 -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build warning-free with MSVC
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          cmake --build "$env:SRC/build" --config Release --parallel

      - name: Prove Streamline owns D3D12 and DXGI imports
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=Join-Path $env:SRC 'build/bin/ExternalDLSSG.exe'
          if(-not(Test-Path $exe)){ throw 'Compiled EXE missing' }
          $deps=& dumpbin /nologo /dependents $exe | Out-String
          $imports=& dumpbin /nologo /imports $exe | Out-String
          $deps | Set-Content (Join-Path $env:SRC 'build/bin/DEPENDENTS.txt') -Encoding UTF8
          $imports | Set-Content (Join-Path $env:SRC 'build/bin/IMPORTS.txt') -Encoding UTF8
          Write-Host $deps
          if($deps -notmatch '(?i)sl\.interposer\.dll'){ throw 'EXE does not depend on sl.interposer.dll' }
          foreach($forbidden in @('dxgi.dll','d3d11.dll','d3d12.dll')){
            if($deps -match [regex]::Escape($forbidden)){ throw "EXE incorrectly links directly to $forbidden" }
          }
          foreach($symbol in @('CreateDXGIFactory2','D3D12CreateDevice')){
            if($imports -notmatch [regex]::Escape($symbol)){ throw "Expected interposed import missing: $symbol" }
          }
          Write-Host 'IMPORT_GATE_PASS: sl.interposer.dll owns the host graphics imports.'

      - name: Verify exact official production runtime files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=Join-Path $env:SRC 'build/bin'
          $official=Join-Path $env:SRC 'third_party/streamline/bin/x64'
          foreach($dll in @('sl.interposer.dll','sl.common.dll','sl.pcl.dll','sl.reflex.dll','sl.dlss_g.dll','nvngx_dlssg.dll')){
            $built=Join-Path $bin $dll; $sdk=Join-Path $official $dll
            if(-not(Test-Path $built)){ throw "Runtime missing from build: $dll" }
            if(-not(Test-Path $sdk)){ throw "Runtime missing from official SDK: $dll" }
            $a=(Get-FileHash $built -Algorithm SHA256).Hash.ToLowerInvariant()
            $b=(Get-FileHash $sdk -Algorithm SHA256).Hash.ToLowerInvariant()
            if($a -ne $b){ throw "$dll differs from checksum-verified official SDK" }
            Write-Host "$dll $a"
          }

      - name: Stage 1 startup smoke test
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $bin=Join-Path $env:SRC 'build/bin'
          $exe=Join-Path $bin 'ExternalDLSSG.exe'
          $p=Start-Process -FilePath $exe -WorkingDirectory $bin -PassThru
          Start-Sleep -Seconds 5
          $p.Refresh()
          $log=Join-Path $bin 'logs/ExternalDLSSG-Zero-Stage1.log'
          if(Test-Path $log){ Get-Content $log -Tail 300 }
          if(-not(Test-Path $log)){ throw 'Persistent Stage1 log was not created' }
          $text=Get-Content $log -Raw
          if($text -notmatch 'ORDER_PROOF: slInit completed before CreateDXGIFactory2 or D3D12CreateDevice'){ throw 'Runtime init-order proof missing' }
          if(-not $p.HasExited){
            Write-Host 'Stage1 process remained alive for five seconds.'
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "Stage1 exited with code $($p.ExitCode) on hosted hardware; log above is authoritative."
          }

      - name: Package Stage 1 evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $out='ExternalDLSSG-Zero-Stage1-Evidence'
          New-Item -ItemType Directory -Force $out | Out-Null
          if($env:SRC){
            $bin=Join-Path $env:SRC 'build/bin'
            if(Test-Path $bin){ Copy-Item "$bin/*" $out -Recurse -Force -ErrorAction SilentlyContinue }
            Copy-Item "$env:SRC/src" $out -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item "$env:SRC/CMakeLists.txt" $out -Force -ErrorAction SilentlyContinue
          }
          git rev-parse HEAD | Set-Content (Join-Path $out 'SOURCE_COMMIT.txt')
          Compress-Archive "$out/*" 'ExternalDLSSG-Zero-Stage1-Evidence.zip' -CompressionLevel Optimal -Force

      - name: Upload Stage 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ExternalDLSSG-Zero-Stage1-Evidence
          path: ExternalDLSSG-Zero-Stage1-Evidence.zip
          if-no-files-found: error
          compression-level: 0
