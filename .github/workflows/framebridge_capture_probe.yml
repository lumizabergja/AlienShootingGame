name: Windows capture probe

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S framebridge_native -B build -G "Visual Studio 17 2022" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package executable
        shell: pwsh
        run: Compress-Archive -Path build/Release/FrameBridgeNative.exe -DestinationPath FrameBridgeNative-CaptureProbe-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: FrameBridgeNative-CaptureProbe-Windows-x64
          path: FrameBridgeNative-CaptureProbe-Windows-x64.zip
