name: Build Fixed V22 Base Latency

on:
  push:
    branches: [chatgpt-v23-build-20261006]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Reconstruct patched V22 source and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = $env:GITHUB_WORKSPACE
          $work = Join-Path $root '_fixedv22'
          New-Item -ItemType Directory -Force -Path $work | Out-Null

          $b64 = ''
          0..12 | ForEach-Object {
            $name = ('part{0:D2}.txt' -f $_)
            $b64 += (Get-Content -Raw -LiteralPath (Join-Path $root ('v23direct/' + $name))).Trim()
          }
          $archive = Join-Path $work 'source.tar.xz'
          [IO.File]::WriteAllBytes($archive, [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLower()
          if ($hash -ne 'fe73518704414047c1506476f0f0da7b1c03f499d477ac6179f6a59d96493a20') {
            throw "Patched source SHA256 mismatch: $hash"
          }

          $seven = 'C:\Program Files\7-Zip\7z.exe'
          if (!(Test-Path $seven)) { throw '7-Zip not found' }
          & $seven x $archive "-o$work" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "XZ extraction failed: $LASTEXITCODE" }
          $tar = Join-Path $work 'source.tar'
          & $seven x $tar "-o$work" -y | Out-Host
          if ($LASTEXITCODE -ne 0) { throw "TAR extraction failed: $LASTEXITCODE" }
          $src = Join-Path $work 'source'
          if (!(Test-Path (Join-Path $src 'main.cpp'))) { throw 'Patched main.cpp missing after extraction' }
          if (!(Select-String -Quiet -LiteralPath (Join-Path $src 'main.cpp') -Pattern 'V23 capture ordering')) { throw 'Latency patch marker missing' }
          if (!(Select-String -Quiet -LiteralPath (Join-Path $src 'dlss_bridge.cpp') -Pattern 'WaitInputReady')) { throw 'Late input wait patch missing' }

          $deps = Join-Path $work 'deps'
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          $slZip = Join-Path $deps 'streamline.zip'
          Invoke-WebRequest -Uri 'https://github.com/NVIDIA-RTX/Streamline/releases/download/v2.14.1/streamline-sdk-v2.14.1.zip' -OutFile $slZip
          $slRoot = Join-Path $deps 'streamline'
          New-Item -ItemType Directory -Force -Path $slRoot | Out-Null
          & tar.exe -xf $slZip -C $slRoot
          if ($LASTEXITCODE -ne 0) { throw "Streamline extraction failed: $LASTEXITCODE" }
          $slHeader = Get-ChildItem $slRoot -Recurse -Filter 'sl.h' -File | Where-Object { $_.FullName -match '[\\/]include[\\/]' } | Select-Object -First 1
          if (!$slHeader) { throw 'Streamline sl.h not found' }
          $slInclude = $slHeader.Directory.FullName

          $nvof = Join-Path $deps 'NvidiaOF5'
          git clone --depth 1 https://github.com/SlimRG/NvidiaOF5.git $nvof
          if ($LASTEXITCODE -ne 0) { throw "NVOF clone failed: $LASTEXITCODE" }

          & rc.exe /nologo /fo (Join-Path $work 'app.res') (Join-Path $src 'app.rc')
          if ($LASTEXITCODE -ne 0) { throw "rc.exe failed: $LASTEXITCODE" }

          $out = Join-Path $work 'DX12-DLSS-FG-V22-DXGI-LOWLATENCY.exe'
          $clArgs = @(
            '/nologo','/std:c++20','/O2','/GL','/EHsc','/MD','/DNDEBUG','/DUNICODE','/D_UNICODE','/DWIN32_LEAN_AND_MEAN','/utf-8',
            "/I$src", "/I$slInclude", "/I$nvof",
            (Join-Path $src 'main.cpp'),
            (Join-Path $src 'dlss_bridge.cpp'),
            (Join-Path $src 'nvof_bridge.cpp'),
            (Join-Path $src 'wgc_capture.cpp'),
            (Join-Path $work 'app.res'),
            '/link', "/OUT:$out", '/SUBSYSTEM:WINDOWS','/LTCG',
            'd3d11.lib','d3d12.lib','dxgi.lib','d3dcompiler.lib','comctl32.lib','user32.lib','gdi32.lib','ole32.lib','runtimeobject.lib','shcore.lib','windowsapp.lib','wintrust.lib','crypt32.lib'
          )
          & cl.exe @clArgs
          if ($LASTEXITCODE -ne 0) { throw "cl.exe failed: $LASTEXITCODE" }
          if (!(Test-Path $out)) { throw 'Rebuilt EXE missing' }
          Get-FileHash -Algorithm SHA256 -LiteralPath $out | Format-List | Out-Host

      - name: Upload rebuilt executable
        uses: actions/upload-artifact@v4
        with:
          name: fixed-v22-exe
          path: _fixedv22/DX12-DLSS-FG-V22-DXGI-LOWLATENCY.exe
          if-no-files-found: error
          retention-days: 3
